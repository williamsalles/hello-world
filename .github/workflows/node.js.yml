name: Node.js CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      # 1. Baixa o código do repositório para o runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura a versão do Node.js (sem a opção 'cache', evitando buscar o lockfile)
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3. Instala as dependências criando o node_modules na hora (funciona só com package.json)
      - name: Install dependencies
        run: npm install

      # 4. Executa o build (se houver o script no package.json)
      - name: Build project
        run: npm run build --if-present

      # 5. Executa os testes
      - name: Run tests
        run: npm test
